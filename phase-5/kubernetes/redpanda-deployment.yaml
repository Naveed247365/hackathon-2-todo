apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: default
  labels:
    app: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
        args:
          - redpanda
          - start
          - --smp=1
          - --memory=512M
          - --reserve-memory=0M
          - --overprovisioned
          - --node-id=0
          - --kafka-addr=PLAINTEXT://0.0.0.0:9092
          - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
          - --pandaproxy-addr=0.0.0.0:8082
          - --advertise-pandaproxy-addr=redpanda:8082
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 8082
          name: proxy
        - containerPort: 9644
          name: admin
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /v1/status/ready
            port: 9644
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: default
spec:
  selector:
    app: redpanda
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  - port: 8082
    targetPort: 8082
    name: proxy
  - port: 9644
    targetPort: 9644
    name: admin
