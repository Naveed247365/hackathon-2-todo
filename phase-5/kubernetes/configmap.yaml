apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: default
data:
  # Backend configuration
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_HOURS: "24"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:30002"
  
  # Frontend configuration
  NEXT_PUBLIC_API_URL: "http://localhost:30001"
  NEXT_PUBLIC_MCP_SERVER_URL: "http://localhost:30003"
  
  # MCP Server configuration
  BACKEND_URL: "http://todo-backend-svc:8000"
  MCP_PORT: "5000"
  LLM_MODEL: "openai/gpt-3.5-turbo"
  
  # Dapr configuration
  DAPR_HTTP_PORT: "3500"
  PUBSUB_NAME: "todo-pubsub"
  STATESTORE_NAME: "todo-statestore"
