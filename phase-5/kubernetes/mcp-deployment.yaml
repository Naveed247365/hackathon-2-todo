apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-mcp
  namespace: default
  labels:
    app: todo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-mcp
  template:
    metadata:
      labels:
        app: todo-mcp
      annotations:
        # Dapr sidecar enabled for service invocation
        dapr.io/enabled: "true"
        dapr.io/app-id: "todo-mcp"
        dapr.io/app-port: "5000"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: mcp
        image: todo-mcp:v5.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: USE_DAPR
          value: "true"
        - name: DAPR_HTTP_PORT
          value: "3500"
        envFrom:
        - configMapRef:
            name: todo-config
        - secretRef:
            name: todo-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: todo-mcp-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: todo-mcp
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30003
    name: http
