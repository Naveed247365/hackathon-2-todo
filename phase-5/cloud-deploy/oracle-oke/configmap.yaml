apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: todo-app
data:
  # Backend configuration
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_HOURS: "24"
  CORS_ORIGINS: "https://todo-app.example.com"
  
  # Frontend configuration (update with actual URLs)
  NEXT_PUBLIC_API_URL: "https://todo-app.example.com/api"
  NEXT_PUBLIC_MCP_SERVER_URL: "https://todo-app.example.com/mcp"
  
  # MCP Server configuration
  BACKEND_URL: "http://todo-backend-svc:8000"
  MCP_PORT: "5000"
  LLM_MODEL: "openai/gpt-3.5-turbo"
  
  # Dapr configuration
  DAPR_HTTP_PORT: "3500"
  PUBSUB_NAME: "todo-pubsub"
