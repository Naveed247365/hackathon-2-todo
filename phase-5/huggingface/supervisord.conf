[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend_err.log
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",OPENROUTER_API_KEY="%(ENV_OPENROUTER_API_KEY)s"

[program:mcp]
command=python -c "from server import app; app.run(host='0.0.0.0', port=5000, debug=False)"
directory=/app/mcp-server
autostart=true
autorestart=true
stdout_logfile=/var/log/mcp.log
stderr_logfile=/var/log/mcp_err.log
environment=BACKEND_URL="http://localhost:8000",OPENROUTER_API_KEY="%(ENV_OPENROUTER_API_KEY)s"

[program:frontend]
command=npm start
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/var/log/frontend.log
stderr_logfile=/var/log/frontend_err.log
environment=NEXT_PUBLIC_API_URL="http://localhost:8000",NEXT_PUBLIC_MCP_SERVER_URL="http://localhost:5000"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx_err.log
