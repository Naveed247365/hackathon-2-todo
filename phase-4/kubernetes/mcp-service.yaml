apiVersion: v1
kind: Service
metadata:
  name: mcp-service
  namespace: default
  labels:
    app: mcp-server
spec:
  type: NodePort  # Expose externally for browser access
  selector:
    app: mcp-server
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30002  # Fixed port for external access
    protocol: TCP
    name: http
