apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: default
data:
  # Backend configuration
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_HOURS: "24"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:56475,http://127.0.0.1:3000,http://127.0.0.1:56475"

  # Frontend configuration (browser needs localhost for NodePort access)
  NEXT_PUBLIC_API_URL: "http://localhost:55015"
  NEXT_PUBLIC_MCP_SERVER_URL: "http://localhost:55022"

  # MCP Server configuration
  BACKEND_URL: "http://backend-service:8000"
  MCP_PORT: "5000"
  LLM_MODEL: "openai/gpt-3.5-turbo"
