apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
  labels:
    app: backend
spec:
  type: NodePort  # Expose externally for browser access
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30001  # Fixed port for external access
    protocol: TCP
    name: http
