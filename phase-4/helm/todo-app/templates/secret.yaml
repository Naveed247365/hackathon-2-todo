apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecret }}
  {{- else }}
  JWT_SECRET_KEY: {{ "your-super-secret-jwt-key-change-in-production" | b64enc }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl }}
  {{- else }}
  DATABASE_URL: {{ "postgresql://user:pass@localhost:5432/todos" | b64enc }}
  {{- end }}
  {{- if .Values.secrets.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey }}
  {{- else }}
  OPENROUTER_API_KEY: {{ "" | b64enc }}
  {{- end }}
